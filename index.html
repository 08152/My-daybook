<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hacker Terminal</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: monospace;
  color: #00ff00;
  overflow: hidden;
}

#terminal {
  padding: 10px;
  height: 100vh;
  overflow-y: auto;
  white-space: pre-wrap;
}

#line {
  display: flex;
}

#input {
  background: transparent;
  border: none;
  outline: none;
  color: #00ff00;
  font-family: monospace;
  width: 100%;
}

#status {
  position: fixed;
  bottom: 5px;
  left: 10px;
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div id="terminal"></div>

<div id="status">CTRL halten → Eingabe | PIN erforderlich</div>

<script>
const terminal = document.getElementById("terminal");

let unlocked = false;
let ctrlDown = false;

const PIN = "error422";
const STORAGE_KEY = "hack_terminal_data_v1";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

if (!data) {
  data = {
    unlocked: false,
    created: Date.now(),
    lines: []
  };
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function print(text) {
  data.lines.push({ t: Date.now(), text });
  save();
  render();
}

function render() {
  terminal.innerHTML = "";
  data.lines.forEach(l => {
    terminal.innerHTML += l.text + "\n";
  });
  terminal.scrollTop = terminal.scrollHeight;
}

function downloadTxt() {
  const date = new Date().toISOString().split("T")[0];
  let content = data.lines.map(l => l.text).join("\n");

  const blob = new Blob([content], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `log_${date}.txt`;
  a.click();
}

function checkExpiration() {
  const now = Date.now();
  const age = now - data.created;

  if (age >= 24 * 60 * 60 * 1000) {
    downloadTxt();
    localStorage.removeItem(STORAGE_KEY);
    data = { unlocked: false, created: Date.now(), lines: [] };
    render();
    print("[SYSTEM] 24h abgelaufen → Exportiert & zurückgesetzt");
  }
}

setInterval(checkExpiration, 60000);
checkExpiration();

document.addEventListener("keydown", (e) => {
  if (e.key === "Control") {
    ctrlDown = true;
  }

  if (ctrlDown && !unlocked) {
    const pin = prompt("PIN eingeben:");
    if (pin === PIN) {
      unlocked = true;
      data.unlocked = true;
      save();
      print("[SYSTEM] Zugriff gewährt");
    } else {
      print("[SYSTEM] Falscher PIN");
    }
  }

  if (ctrlDown && unlocked) {
    if (e.key.length === 1) {
      print("> " + e.key);
    }

    if (e.key === "Enter") {
      print("");
    }
  }
});

document.addEventListener("keyup", (e) => {
  if (e.key === "Control") {
    ctrlDown = false;
  }
});

render();
</script>

</body>
</html>
