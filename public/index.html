<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hacker Terminal</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: monospace;
  overflow: hidden;
}

#terminal {
  padding: 10px;
  height: 100vh;
  overflow-y: auto;
  white-space: pre-wrap;
}

#status {
  position: fixed;
  bottom: 5px;
  left: 10px;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div id="terminal"></div>
<div id="status">CTRL + Tippen | PIN erforderlich</div>

<script>
const terminal = document.getElementById("terminal");

let ctrl = false;
let ws;
let unlocked = false;

function connect() {
  ws = new WebSocket(location.origin.replace("http", "ws"));

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.type === "init") {
      data.lines.forEach(l => add(l.text));
    }

    if (data.type === "line") {
      add(data.text);
    }

    if (data.type === "unlocked") {
      unlocked = true;
      add("[SYSTEM] Zugriff erlaubt");
    }

    if (data.type === "reset") {
      terminal.innerHTML = "";
    }
  };
}

function add(t) {
  terminal.innerHTML += t + "\n";
  terminal.scrollTop = terminal.scrollHeight;
}

connect();

document.addEventListener("keydown", (e) => {
  if (e.key === "Control") ctrl = true;

  if (ctrl && !unlocked) {
    const pin = prompt("PIN eingeben:");
    ws.send(JSON.stringify({ type: "pin", pin }));
  }

  if (ctrl && unlocked) {
    if (e.key.length === 1) {
      ws.send(JSON.stringify({ type: "line", text: "> " + e.key }));
    }

    if (e.key === "Enter") {
      ws.send(JSON.stringify({ type: "line", text: "" }));
    }
  }
});

document.addEventListener("keyup", (e) => {
  if (e.key === "Control") ctrl = false;
});
</script>

</body>
</html>
