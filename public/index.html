<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacker Terminal</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: monospace;
  overflow: hidden;
}

#terminal {
  padding: 10px;
  padding-top: 50px; /* Platz für die obere Touch-Zone */
  padding-bottom: 110px; /* Platz für die untere Touch-Zone und Eingabezeile */
  height: 100vh;
  overflow-y: auto;
  box-sizing: border-box;
  white-space: pre-wrap;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch; /* Sanftes Scrollen auf iOS */
}

/* Touchscreen Scroll-Zonen */
.scroll-zone {
  position: fixed;
  left: 0;
  width: 100%;
  height: 45px;
  background: rgba(0, 255, 0, 0.03); /* Minimal sichtbar als Orientierung */
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 12px;
  color: #004400;
  user-select: none;
  cursor: pointer;
  z-index: 10;
}

#scrollUp {
  top: 0;
  border-bottom: 1px dashed #002200;
}

#scrollDown {
  bottom: 60px; /* Direkt über der Eingabezeile */
  border-top: 1px dashed #002200;
}

#inputLine {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  padding: 15px;
  background: black;
  box-sizing: border-box;
  border-top: 1px solid #004400;
  z-index: 20;
}

#prompt {
  margin-right: 10px;
  font-size: 16px;
}

.input-container {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

#input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: #00ff00;
  font-family: monospace;
  font-size: 16px;
  caret-color: transparent;
}

#cursor {
  position: absolute;
  left: 0;
  width: 10px;
  height: 18px;
  background-color: #00ff00;
  animation: blink 0.8s infinite;
  pointer-events: none;
  display: inline-block;
}

@keyframes blink {
  0%, 49% { background-color: #00ff00; }
  50%, 100% { background-color: transparent; }
}

#input:disabled {
  color: #004400;
  cursor: not-allowed;
}

#input:disabled + #cursor {
  background-color: #004400;
}
</style>
</head>

<body>

<!-- Touch-Zonen für Touchscreen-Bedienung -->
<div id="scrollUp" class="scroll-zone">▲ SCROLL UP ▲</div>
<div id="scrollDown" class="scroll-zone">▼ SCROLL DOWN ▼</div>

<div id="terminal"></div>

<div id="inputLine">
  <span id="prompt">></span>
  <div class="input-container">
    <input id="input" type="text" placeholder="[STRG drücken für PIN-Eingabe]" disabled />
    <span id="cursor"></span>
  </div>
</div>

<script>
const terminal = document.getElementById("terminal");
const input = document.getElementById("input");
const cursor = document.getElementById("cursor");
const scrollUpBtn = document.getElementById("scrollUp");
const scrollDownBtn = document.getElementById("scrollDown");

let ws;
let unlocked = false;
let ctrlUsed = false;
let scrollInterval;

// Funktion zum Hinzufügen von Text und automatischem Scrollen
function add(text) {
  terminal.innerHTML += text + "\n";
  setTimeout(() => {
    terminal.scrollTop = terminal.scrollHeight;
  }, 10);
}

// Touchscreen Scroll-Logik (Draufdrücken hält das Scrollen aktiv)
function startScrolling(direction) {
  clearInterval(scrollInterval);
  scrollInterval = setInterval(() => {
    terminal.scrollBy({
      top: direction * 40,
      behavior: 'auto'
    });
  }, 40);
}

function stopScrolling() {
  clearInterval(scrollInterval);
}

// Event Listener für Touch-Geräte und Maus-Klicks (Scrollen)
scrollUpBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startScrolling(-1); });
scrollUpBtn.addEventListener("touchend", stopScrolling);
scrollUpBtn.addEventListener("mousedown", () => startScrolling(-1));
scrollUpBtn.addEventListener("mouseup", stopScrolling);
scrollUpBtn.addEventListener("mouseleave", stopScrolling);

scrollDownBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startScrolling(1); });
scrollDownBtn.addEventListener("touchend", stopScrolling);
scrollDownBtn.addEventListener("mousedown", () => startScrolling(1));
scrollDownBtn.addEventListener("mouseup", stopScrolling);
scrollDownBtn.addEventListener("mouseleave", stopScrolling);

// Funktion für den automatischen Download mit englischem Datum & Zeitformat
function downloadAndReset() {
  const textContent = terminal.innerText;
  
  if (!textContent.trim()) return;

  const jetzt = new Date();
  const optionsDatum = { month: '2-digit', day: '2-digit', year: 'numeric' };
  let englischesDatum = jetzt.toLocaleDateString('en-US', optionsDatum);
  englischesDatum = englischesDatum.replace(/\//g, '-');

  const optionsZeit = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
  let englischeZeit = jetzt.toLocaleTimeString('en-US', optionsZeit);
  englischeZeit = englischeZeit.replace(/[: ]/g, '_');
  
  const dateiname = `${englischesDatum}_${englischeZeit}.txt`;

  const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = dateiname;
  
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  terminal.innerHTML = "";
  add("[SYSTEM] Automatischer täglicher Export abgeschlossen. Terminal zurückgesetzt.");
}

// Überprüft jede Sekunde die Uhrzeit für den Trigger
setInterval(() => {
  const jetzt = new Date();
  const stunden = jetzt.getHours();
  const minuten = jetzt.getMinutes();
  const sekunden = jetzt.getSeconds();

  if (stunden === 23 && minuten === 59 && sekunden === 50) {
    downloadAndReset();
  }
}, 1000);

// Positioniert den dicken Hacker-Cursor exakt hinter dem Text
function updateCursorPosition() {
  const text = input.value;
  const helper = document.createElement("span");
  helper.style.font = window.getComputedStyle(input).font;
  helper.style.visibility = "hidden";
  helper.style.whiteSpace = "pre";
  helper.textContent = text;
  document.body.appendChild(helper);
  
  const textWidth = helper.getBoundingClientRect().width;
  document.body.removeChild(helper);
  
  cursor.style.left = textWidth + "px";
}

input.addEventListener("input", updateCursorPosition);
window.addEventListener("resize", updateCursorPosition);

function connect() {
  ws = new WebSocket(location.origin.replace("http", "ws"));

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.type === "init") {
      data.lines.forEach(l => add(l.text));
    }

    if (data.type === "line") {
      add(data.text);
    }

    if (data.type === "unlocked") {
      unlocked = true;
      input.disabled = false;
      input.placeholder = "Befehl eingeben...";
      input.focus();
      updateCursorPosition();
      add("[SYSTEM] Zugriff erlaubt. Sie können jetzt schreiben.");
    }

    if (data.type === "error") {
      add("[SYSTEM] Falscher PIN. Zugriff verweigert.");
      ctrlUsed = false;
    }

    if (data.type === "reset") {
      terminal.innerHTML = "";
    }
  };

  ws.onclose = () => {
    add("[SYSTEM] Verbindung verloren. Verbinde neu...");
    setTimeout(connect, 3000);
  };
}

connect();

/* PIN-Abfrage über STRG */
document.addEventListener("keydown", (e) => {
  if (e.key === "Control" && !ctrlUsed) {
    ctrlUsed = true;

    const pin = prompt("PIN eingeben:");
    if (pin) {
      ws.send(JSON.stringify({ type: "pin", pin }));
    } else {
      ctrlUsed = false;
    }
  }
});

/* Eingabe absenden */
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const text = input.value.trim();

    if (text && unlocked) {
      ws.send(JSON.stringify({
        type: "line",
        text: "> " + text
      }));
    }

    input.value = "";
    setTimeout(updateCursorPosition, 10);
  }
});

document.getElementById("inputLine").addEventListener("click", () => {
  if (!input.disabled) {
    input.focus();
  }
});
</script>

</body>
</html>
